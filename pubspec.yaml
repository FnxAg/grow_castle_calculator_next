name: grow_castle_calculator_next
description: "A tool for mobile game Grow Castle."
publish_to: 'none'
version: 1.5.1+1

environment:
  sdk: ">=3.13.1"
  flutter: ">=3.47.1"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get_it: ^9.2.1
  hive_flutter: ^1.1.0
  flutter_displaymode: ^0.7.0
  http: ^1.6.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  fl_chart: ^1.1.1
  material_ui: ^1.1.0
  dynamic_color: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
