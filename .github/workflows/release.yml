name: Flutter Build & Auto Release

# 触发条件：推送 tag（v*）或 main 分支时运行
on:
  push:
    tags:
      - 'v*'
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_PATH: android/app/upload-keystore.jks

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # 拉取完整提交历史
          fetch-depth: 0

      - name: Restore keystore file
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks

      # 设置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8' # 修改为本地Flutter版本
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      # 上传产物到Action工件（调试用）
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: app-build-files
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      # 自动创建 GitHub Release 并上传安装包（仅在推送 tag 时执行）
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          generate_release_notes: true # 自动生成更新日志
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}